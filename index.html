<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量子计算机 · 3D 原理探索</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="labels"></div>

      <header id="topbar">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 40 40" width="30" height="30">
              <circle cx="20" cy="20" r="3.4" fill="currentColor" />
              <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="currentColor" stroke-width="1.6" />
              <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(60 20 20)" />
              <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(120 20 20)" />
            </svg>
          </div>
          <div>
            <div class="brand-title">量子计算机 3D 原理探索</div>
            <div class="brand-sub">从稀释制冷机到量子干涉：它为什么能算得这么快？</div>
          </div>
        </div>
        <nav id="tabs"></nav>
      </header>

      <aside id="panel"></aside>

      <div id="hint">左键拖动旋转 · 滚轮缩放 · 右键平移 · 数字键 1–7 切换章节</div>

      <div id="loading">
        <div class="spinner"></div>
        <div>正在构建量子计算机模型…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
